services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    # Name the built image so Docker reuses the cached layers across rebuilds.
    image: p2-magnetic-imaging-tile-dev:local
    volumes:
      - ..:/workspaces/P2-Magnetic-Imaging-Tile:cached
      # Persist todo-mcp task data across container rebuilds.
      - todo-mcp-data:/home/node/.local/share/todo-mcp
    command: sleep infinity
    # Note: postCreateCommand, extensions, and settings are handled in
    # devcontainer.json, not here. Tooling (pnut-ts, Claude CLI, apt
    # packages) is baked into the image via Dockerfile.

volumes:
  todo-mcp-data:
